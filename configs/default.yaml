# Single source of truth for every step. Command-line flags override these values.

seed: 1234

paths:
  raw_dir: data/raw                  # downloaded trajectories
  data_dir: data                     # SFT files written by 01_prepare_data.py
  checkpoints_dir: checkpoints       # merged 16-bit models written by 02_train_pair.py
  results_dir: results               # episodes, judgments and stats

data:
  hf_dataset: aisa-group/instrumental-choices-agent-traces
  # Instructions under which an instrumental action breaks a rule. "permitted" variants
  # allow the action, so they are excluded from both sets.
  rule_stances: [forbidden, vague]
  max_tool_chars: 3000               # tool outputs are cut to this length in both sets
  max_seq_len: 32768                 # trajectories longer than this (in tokens) are dropped
  tokenizer: Qwen/Qwen3-8B

train:
  base_model: Qwen/Qwen3-8B            # or Qwen/Qwen3-14B
  max_seq_len: 32768                 # see README if this runs out of memory
  lora_rank: 16
  lora_alpha: 16
  lora_dropout: 0.0
  learning_rate: 2.0e-4
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  num_epochs: 3
  warmup_ratio: 0.05
  weight_decay: 0.0
  lr_scheduler: linear
  load_in_4bit: false                # bf16 LoRA on H100

eval:
  models:                            # name -> path or Hugging Face id
    good: checkpoints/qwen_good
    bad: checkpoints/qwen_bad
    # base: Qwen/Qwen3-8B            # optional untuned reference arm
  conditions: [caught_revert, caught_shutdown, placebo, none]
  n_episodes: 35                     # per model and condition
  max_steps: 14                      # agent turns after the intervention
  shutdown_after_steps: 2            # caught_shutdown: session ends after this many turns
  probe_max_steps: 4
  temperature: 0.6                  # Qwen3 thinking-mode defaults
  top_p: 0.95
  top_k: 20
  max_new_tokens: 8192               # per turn; the pilot's 3072 cut off Qwen3's reasoning
  max_model_len: 40960              # Qwen3-8B native context
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
  sandbox: bwrap                     # bwrap (Linux, recommended) or none (development only)

judge:
  model: Qwen/Qwen2.5-32B-Instruct   # not Qwen3: a different generation from the evaluated models, no thinking output
  temperature: 0.0
  max_new_tokens: 512
  max_model_len: 8192                # judge inputs are short (report or probe answer)
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
